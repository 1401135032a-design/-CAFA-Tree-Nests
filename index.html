    function esc(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(window.__t);
      window.__t = setTimeout(() => el.classList.remove("show"), 2000);
    }

    function avatarStyle(seed) {
      const c1 = AVATAR_COLORS[Math.abs(seed) % AVATAR_COLORS.length];
      const c2 = AVATAR_COLORS[Math.abs(seed * 7 + 3) % AVATAR_COLORS.length];
      return `background: linear-gradient(135deg, ${c1}, ${c2});`;
    }

    function rollNickname() {
      const p = PREFIXES[Math.floor(Math.random() * PREFIXES.length)];
      const n = NOUNS[Math.floor(Math.random() * NOUNS.length)];
      return p + n;
    }

    function applyTheme() {
      document.body.classList.toggle("dark", state.dark);
      localStorage.setItem("ym_dark", state.dark ? "1" : "0");
    }

    function savePersona() {
      localStorage.setItem("ym_persona", JSON.stringify(state.persona));
    }

    function openModal(html) {
      document.getElementById("modalSheet").innerHTML = html;
      document.getElementById("modalBackdrop").classList.add("open");
    }
    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("open");
    }
    document.getElementById("modalBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "modalBackdrop") closeModal();

      let list = [...state.posts];
      if (state.homeTab === "推荐") list.sort((a,b) => b.likes - a.likes);

    function renderCourses() {
      const campuses = ["全部校区", "望京本院", "燕郊校区", "上海校区"];
      const types = ["全部类型", "跨院选修", "公共选修", "体育选修"];

        </div>
      `;

      const q = state.courseQuery.trim().toLowerCase();
      const filtered = state.courses.filter(c => {
        const mc = state.courseCampus === "全部校区" || c.campus === state.courseCampus;
        const mt = state.courseType === "全部类型" || c.type === state.courseType;
        const mq = !q || c.name.toLowerCase().includes(q) || c.teacher.toLowerCase().includes(q) || c.college.toLowerCase().includes(q) || c.summary.toLowerCase().includes(q);
        return mc && mt && mq;
      });

      const notice = (state.courseType === "全部类型" || state.courseType === "跨院选修")
        ? `<div class="notice-box">ⓘ 选课规则提醒：跨校区线下课通常不可互选（望京本院与燕郊城院线下课不可互选，中法跨校暂不支持），具体以当学期教务系统备注为准。</div>`
        : "";

      const main = document.getElementById("main");
      if (!filtered.length) {
        main.innerHTML = notice + `<div class="empty">当前筛选条件下暂无选课评价。</div>`;
        return;
      }

      const groups = {};
      filtered.forEach(c => { (groups[c.group] = groups[c.group] || []).push(c); });

      main.innerHTML = notice + Object.entries(groups).map(([gName, items]) => `

          <span class="meta">${items.length} 门课程</span>

                <span class="meta" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${c.campus} · ${c.college}</span>
              </div>
              <span class="meta">详情 ›</span>
            </div>
            <h3 class="post-title">${c.name}</h3>
            <div class="meta" style="margin-bottom:6px;">授课教师：${c.teacher} · ${c.group}</div>
            <p class="post-body" style="font-size:13px;margin-bottom:8px;">${c.summary}</p>
            <div class="metrics-grid">
              <div><div class="metric-val hl">${c.rec ? c.rec.toFixed(1) : "--"}</div><div class="metric-lbl">综合推荐</div></div>
              <div><div class="metric-val">${c.grade ? c.grade.toFixed(1) : "--"}</div><div class="metric-lbl">给分友好</div></div>
              <div><div class="metric-val">${c.work ? c.work.toFixed(1) : "--"}</div><div class="metric-lbl">作业强度</div></div>
              <div><div class="metric-val">${c.reviews.length} 份</div><div class="metric-lbl">同学评价</div></div>
            </div>
            <div class="h-scroll">
              ${c.tags.map(t => `<span class="cat-tag ${t==='慎选避雷'?'warn':t==='水课'?'green':''}">${t}</span>`).join("")}
            </div>
          </article>
        `).join("")}
      `).join("");
    }

        </section>

        <section class="card">
          <div style="font-size:15px;font-weight:700;margin-bottom:6px;">安装到手机桌面</div>
          <div class="meta" style="line-height:1.65;">
            • <b>iPhone (Safari)</b>：点击底部「分享」按钮 →「添加到主屏幕」，即可像 App 一样全屏打开。<br/>
            • <b>Android (Chrome)</b>：点击浏览器菜单「安装应用 / 添加到主屏幕」，或在项目设置中直接导出原生 Android APK 安装包。
          </div>
        </section>

        <section class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <span style="font-size:14px;font-weight:700;">当前版本</span>
            <span class="mini-tag">v1.0.1</span>
          </div>
          <div class="notice-box">
            <div style="font-weight:700;color:var(--text);margin-bottom:4px;">© 2026 李明轩（创建者）版权所有 · 保留一切权利</div>
            本应用「杨梅树窝」的创意策划、界面视觉与原创程序归创建者李明轩所有。未经创建者书面许可，禁止复制、修改分发或用于商业用途。
          </div>
        </section>

        <div class="footer-copy">
          杨梅树窝 v1.0.1 · 创建者：李明轩<br/>© 2026 李明轩（创建者）版权所有 · 保留一切权利
        </div>
      `;
    }

    function render() {
      applyTheme();
      document.querySelectorAll(".nav-item").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === state.nav);
      });
      if (state.nav === "home") renderHome();
      else if (state.nav === "courses") renderCourses();
      else if (state.nav === "messages") renderMessages();
      else renderProfile();
    }

    window.setHomeTab = (t) => { state.homeTab = t; renderHome(); };
    window.setCourseCampus = (c) => { state.courseCampus = c; renderCourses(); };
    window.setCourseType = (t) => { state.courseType = t; renderCourses(); };
    window.setCourseQuery = (q) => { state.courseQuery = q; renderCourses(); };
    window.toggleDarkMode = () => { state.dark = !state.dark; render(); };

    window.toggleLike = (id) => {
      const p = state.posts.find(x => x.id === id);
      if (!p) return;
      p.liked = !p.liked;
      p.likes += p.liked ? 1 : -1;
      renderHome();
    };

    window.openPostDetail = (id) => {
      const p = state.posts.find(x => x.id === id);
      if (!p) return;
      openModal(`
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <strong style="font-size:16px;">帖子详情</strong>
          <button class="pill-btn" onclick="closeModal()">关闭</button>
        </div>
        <h3 class="post-title">${esc(p.title)}</h3>
        <div class="meta" style="margin-bottom:10px;">${esc(p.author)} · ${esc(p.time)}</div>
        <p class="post-body">${esc(p.body)}</p>
        <div style="font-size:13px;font-weight:700;margin:14px 0 6px;">全部评论 (${p.comments.length})</div>
        ${p.comments.length ? p.comments.map(c => `
          <div class="review-item">
            <div style="font-weight:700;margin-bottom:4px;">${esc(c.author)} ${c.isOp ? '<span class="cat-tag" style="margin-left:4px;">楼主</span>' : ''}</div>
            <div>${esc(c.text)}</div>
          </div>
        `).join("") : '<div class="meta" style="padding:12px 0;">暂无评论，来写下第一条回复吧。</div>'}
        <div style="display:flex;gap:8px;margin-top:14px;">
          <input class="input" id="commentInput" placeholder="匿名发表评论..." />
          <button class="pill-btn primary" onclick="submitComment('${esc(p.id)}')">发送</button>
        </div>
      `);
    };

    window.submitComment = (id) => {
      const val = (document.getElementById("commentInput")?.value || "").trim();
      if (!val) return showToast("请输入评论内容");
      const p = state.posts.find(x => x.id === id);
      if (!p) return;
      p.comments.push({ author: state.persona.nickname, text: val, isOp: p.author === state.persona.nickname });
      showToast("评论已发布");
      openPostDetail(id);
      if (state.nav === "home") renderHome();
    };

    window.openComposeModal = () => {
      openModal(`
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <strong style="font-size:16px;">匿名发布新帖</strong>
          <button class="pill-btn" onclick="closeModal()">关闭</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <select class="input" id="postCat">
            <option value="校园互助">校园互助</option>
            <option value="闲置交换">闲置交换</option>
            <option value="恋爱情感">恋爱情感</option>
            <option value="展览资讯">展览资讯</option>
          </select>
          <input class="input" id="postTitle" maxlength="30" placeholder="标题（简短明了）" />
          <textarea class="input" id="postBody" rows="4" placeholder="分享你在央美的日常、想法或互助信息..."></textarea>
          <input class="input" id="postTag" placeholder="自定义标签，例如 #央美日常（选填）" />
          <button class="pill-btn primary" style="justify-content:center;padding:12px;" onclick="publishPost()">立即发布</button>
        </div>
      `);
    };

    window.publishPost = () => {
      const title = document.getElementById("postTitle").value.trim();
      const body = document.getElementById("postBody").value.trim();
      const cat = document.getElementById("postCat").value;
      const tagRaw = document.getElementById("postTag").value.trim();
      if (!body) return showToast("请填写正文内容");
      const tags = tagRaw ? [tagRaw.startsWith("#") ? tagRaw : "#" + tagRaw] : ["#" + cat];
      state.posts.unshift({
        id: "p_" + Date.now(),
        category: cat,
        author: state.persona.nickname,
        seed: state.persona.seed,
        time: "刚刚",
        title: title || body.slice(0, 18),
        body,
        tags,
        likes: 0,
        liked: false,
        comments: []
      });
      closeModal();
      showToast("发布成功");
      renderHome();
    };

    window.openCourseDetail = (id) => {
      const c = state.courses.find(x => x.id === id);
      if (!c) return;
      openModal(`
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <span class="cat-tag">${esc(c.campus)} · ${esc(c.college)}</span>
          <button class="pill-btn" onclick="closeModal()">关闭</button>
        </div>
        <h3 class="post-title" style="font-size:18px;">${esc(c.name)}</h3>
        <div class="meta" style="margin-bottom:8px;">授课教师：${esc(c.teacher)} · ${esc(c.group)}</div>
        <p class="post-body">${esc(c.summary)}</p>
        <div style="font-size:13px;font-weight:700;margin:12px 0 6px;">同学真实评价 (${c.reviews.length})</div>
        ${c.reviews.length ? c.reviews.map(r => `<div class="review-item">${esc(r)}</div>`).join("") : '<div class="meta" style="padding:10px 0;">暂无评价，欢迎成为第一位补充者。</div>'}
        <div style="display:flex;gap:8px;margin-top:14px;">
          <input class="input" id="courseReviewInput" placeholder="补充你的上课体验、考勤或给分建议..." />
          <button class="pill-btn primary" onclick="submitCourseReview('${esc(c.id)}')">提交</button>
        </div>
      `);
    };

    window.submitCourseReview = (id) => {
      const val = (document.getElementById("courseReviewInput")?.value || "").trim();
      if (val.length < 2) return showToast("请写下简短的真实上课感受");
      const c = state.courses.find(x => x.id === id);
      if (!c) return;
      c.reviews.unshift(val);
      if (!c.rec) { c.rec = 4.0; c.grade = 4.0; c.work = 3.0; }
      showToast("评价已提交");
      openCourseDetail(id);
      renderCourses();
    };

    window.quickRandomPersona = () => {
      state.persona = { nickname: rollNickname(), seed: Math.floor(Math.random() * 90000) + 100 };
      savePersona();
      showToast("已切换匿名身份：" + state.persona.nickname);
      renderProfile();
    };

    window.openPersonaModal = () => {
      const samples = Array.from({ length: 6 }, () => rollNickname());
      const seeds = Array.from({ length: 8 }, () => Math.floor(Math.random() * 90000) + 100);
      openModal(`
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <strong style="font-size:16px;">自定义昵称与形象</strong>
          <button class="pill-btn" onclick="closeModal()">关闭</button>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:10px;">
          <input class="input" id="nickInput" maxlength="16" value="${esc(state.persona.nickname)}" placeholder="输入 2~16 字昵称" />
          <button class="pill-btn" onclick="document.getElementById('nickInput').value=rollNickname()">✦ 随机</button>
        </div>
        <div class="h-scroll" style="margin-bottom:14px;">
          ${samples.map(s => `<button class="chip" onclick="document.getElementById('nickInput').value='${esc(s)}'">${esc(s)}</button>`).join("")}
        </div>
        <div class="meta" style="margin-bottom:8px;">点击挑选匿名形象：</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;">
          ${seeds.map(sd => `<button style="border:none;background:none;cursor:pointer;display:grid;place-items:center;" onclick="pickSeed(${sd})"><div class="avatar" style="width:48px;height:48px;border-radius:14px;${avatarStyle(sd)}">✦</div></button>`).join("")}
        </div>
        <button class="pill-btn primary" style="width:100%;justify-content:center;padding:12px;" onclick="saveCustomPersona()">保存昵称与形象</button>
      `);
    };

    window.pickSeed = (sd) => {
      state.persona.seed = sd;
      showToast("已选中新形象");
    };

    window.saveCustomPersona = () => {
      const nick = (document.getElementById("nickInput")?.value || "").trim();
      if (nick.length < 2) return showToast("昵称至少需要 2 个字");
      state.persona.nickname = nick;
      savePersona();
      closeModal();
      showToast("昵称与形象已保存");
      renderProfile();
    };

    document.querySelectorAll(".nav-item").forEach(btn => {
      btn.addEventListener("click", () => {
        state.nav = btn.dataset.tab;
        render();
      });
    });

    render();
  </script>
</body>
</html>
