<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07070C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="杨梅树窝" />
  <meta name="description" content="杨梅树窝 · 中央美术学院匿名校园社区。在杨梅树下，聊聊央美的生活。" />
  <title>杨梅树窝 · 中央美术学院校园社区</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/jpeg" href="./app/src/main/res/drawable/ic_yangmei_logo.jpg" />
  <link rel="apple-touch-icon" href="./app/src/main/res/drawable/ic_yangmei_logo.jpg" />
  <link rel="stylesheet" href="./web/styles.css?v=2" />
</head>
<body>
  <div id="app-frame">
    <!-- Unified Aurora Page Background (Exact AuroraPageBackground.kt) -->
    <div class="aurora-bg" aria-hidden="true">
      <div class="aurora-ambient-1"></div>
      <div class="aurora-ambient-2"></div>
      <div class="aurora-ambient-3"></div>
      <div class="aurora-top-wash"></div>
    </div>

    <!-- Splash Screen (Exact SplashIntroScreen.kt) -->
    <section id="splash-screen" aria-label="杨梅树窝开屏页">
      <div class="splash-glow-layer" aria-hidden="true">
        <div class="splash-orb splash-orb-1"></div>
        <div class="splash-orb splash-orb-2"></div>
        <div class="splash-orb splash-orb-3"></div>
      </div>
      <div class="splash-noise" aria-hidden="true"></div>

      <div class="splash-content">
        <div class="splash-logo-wrap">
          <img id="splash-logo-img" data-yangmei-logo="dark" alt="杨梅树窝 Logo" />
        </div>

        <h1 class="splash-title" aria-label="杨梅树窝">
          <span class="splash-title-char">杨</span><span class="splash-title-char">梅</span><span class="splash-title-char">树</span><span class="splash-title-char">窝</span>
        </h1>

        <div class="splash-subtitles">
          <p>在杨梅树下，聊聊央美的生活。</p>
          <p>关于学习、生活、艺术、情绪，和只有央美人懂的事情</p>
        </div>

        <div class="beam-btn-wrap">
          <button id="splash-enter-btn" class="beam-btn" type="button">
            <span class="beam-btn-mask" aria-hidden="true"></span>
            <span>进入树窝</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Dynamic Main Screen Viewport -->
    <main id="main-viewport"></main>

    <!-- Floating Aurora '+' FAB -->
    <button id="main-fab" type="button" aria-label="发布新内容"></button>

    <!-- Floating Glass 4-Tab Aurora Bottom Navigation Bar -->
    <div id="bottom-nav-wrap"></div>

    <!-- Bottom Sheet / Modal Overlay Root -->
    <div id="modal-root"></div>

    <!-- Toast Feedback -->
    <div id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="./web/data.js?v=2"></script>
  <script src="./web/app.js?v=2"></script>
</body>
</html>
